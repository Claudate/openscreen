name: "Build Desktop (Unsigned)"

# Fork 专用云端打包：无任何官方 secrets（CrabNebula / Apple 签名 / SignPath / Sentry），
# 产出未签名安装包上传到 Actions artifact。macOS 用 ad-hoc 签名（首次打开需右键 → 打开）。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform(s) to build"
        required: false
        default: "both"
        type: choice
        options:
          - macos
          - windows
          - both

env:
  # 与 ci.yml 相同的公开 DSN（仅编译期注入用）
  CAP_DESKTOP_SENTRY_URL: https://6a3b6a09e6ae976c2ad6fff710e88748@o4506859771527168.ingest.us.sentry.io/4508330917101568

jobs:
  build-macos:
    name: Build macOS (aarch64, unsigned)
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'both' }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ env.TARGET }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.TARGET }}

      - uses: ./.github/actions/setup-js

      - name: Create .env file (no RUST_TARGET_TRIPLE — breaks Nitro)
        shell: bash
        run: |
          {
            echo "VITE_ENVIRONMENT=production"
            echo "CAP_DESKTOP_SENTRY_URL=${{ env.CAP_DESKTOP_SENTRY_URL }}"
            echo "NEXT_PUBLIC_WEB_URL=https://cap.so"
            echo "NEXTAUTH_URL=https://cap.so"
            echo "VITE_SERVER_URL=https://cap.so"
          } >> .env
          cp .env apps/desktop/.env

      - name: Run cap-setup (native deps, ad-hoc signing)
        shell: bash
        run: pnpm -w cap-setup
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}

      - name: Build sidecar binaries
        shell: bash
        run: ./scripts/build-desktop-binaries.sh ${{ env.TARGET }}

      - name: Verify sidecar binaries (macOS)
        if: ${{ !contains(env.TARGET, 'windows') }}
        shell: bash
        run: |
          for bin in cap-muxer cap-cli cap-exporter; do
            f="apps/desktop/src-tauri/binaries/${bin}-${{ env.TARGET }}"
            if [[ ! -f "$f" ]]; then echo "MISSING: $f" >&2; exit 1; fi
            echo "OK: $f ($(stat -f%z "$f") bytes)"
          done

      - name: Verify sidecar binaries (Windows)
        if: ${{ contains(env.TARGET, 'windows') }}
        shell: bash
        run: |
          for bin in cap-muxer cap-cli cap-exporter; do
            f="apps/desktop/src-tauri/binaries/${bin}-${{ env.TARGET }}.exe"
            if [[ ! -f "$f" ]]; then echo "MISSING: $f" >&2; exit 1; fi
            echo "OK: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Build frontend (isolated from Rust env vars)
        working-directory: apps/desktop
        shell: bash
        run: |
          unset TARGET RUST_TARGET_TRIPLE
          pnpm turbo build --filter @cap/desktop
        env:
          CI: false
          NITRO_PRESET: static

      - name: Build app (unsigned bundle, skip frontend)
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ env.TARGET }} --config src-tauri/ci-unsigned.conf.json
        env:
          CI: false
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}
          NITRO_PRESET: static

      - name: Zip .app bundle (preserve symlinks/permissions)
        shell: bash
        run: |
          BUNDLE_DIR="target/${{ env.TARGET }}/release/bundle/macos"
          cd "$BUNDLE_DIR"
          APP_NAME="$(ls -d *.app | head -n 1)"
          ditto -c -k --keepParent "$APP_NAME" Cap-macos-aarch64-app.zip
          ls -la

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cap-macos-aarch64-unsigned
          path: |
            target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
            target/${{ env.TARGET }}/release/bundle/macos/Cap-macos-aarch64-app.zip
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS (x86_64, unsigned)
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'both' }}
    runs-on: macos-13
    timeout-minutes: 120
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ env.TARGET }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.TARGET }}

      - uses: ./.github/actions/setup-js

      - name: Create .env file
        shell: bash
        run: |
          {
            echo "VITE_ENVIRONMENT=production"
            echo "CAP_DESKTOP_SENTRY_URL=${{ env.CAP_DESKTOP_SENTRY_URL }}"
            echo "NEXT_PUBLIC_WEB_URL=https://cap.so"
            echo "NEXTAUTH_URL=https://cap.so"
            echo "VITE_SERVER_URL=https://cap.so"
