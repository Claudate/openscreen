          path: |
            target/${{ env.TARGET }}/release/bundle/dmg/*.dmg
            target/${{ env.TARGET }}/release/bundle/macos/Reko-macos-x64-app.zip
            target/${{ env.TARGET }}/release/bundle/macos/GATEKEEPER.txt
          if-no-files-found: error

  build-windows:
    name: Build Windows (x86_64, unsigned)
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'both' }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ env.TARGET }}

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: ${{ env.TARGET }}
          save-cache: "true"

      - uses: ./.github/actions/setup-js

      - name: Create .env file
        shell: bash
        run: |
          {
            echo "VITE_ENVIRONMENT=production"
            echo "CAP_DESKTOP_SENTRY_URL=${{ env.CAP_DESKTOP_SENTRY_URL }}"
            echo "NEXT_PUBLIC_WEB_URL=https://cap.so"
            echo "NEXTAUTH_URL=https://cap.so"
            echo "VITE_SERVER_URL=https://cap.so"
          } >> .env
          cp .env apps/desktop/.env

      - name: Run cap-setup (ffmpeg, MSVC check)
        shell: bash
        run: pnpm -w cap-setup
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}

      - name: Build sidecar binaries
        shell: bash
        run: ./scripts/build-desktop-binaries.sh ${{ env.TARGET }}

      - name: Verify sidecar binaries
        shell: bash
        run: |
          for bin in cap-muxer cap-cli cap-exporter; do
            f="apps/desktop/src-tauri/binaries/${bin}-${{ env.TARGET }}.exe"
            if [[ ! -f "$f" ]]; then echo "MISSING: $f" >&2; exit 1; fi
            echo "OK: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Build frontend (isolated from Rust env vars)
        working-directory: apps/desktop
        shell: bash
        run: |
          unset TARGET RUST_TARGET_TRIPLE
          pnpm turbo build --filter @cap/desktop
        env:
          CI: false
          NITRO_PRESET: static

      - name: Prepare desktop bundle config
        run: pnpm --dir apps/desktop run preparescript

      - name: Stage Windows runtime DLLs (before Tauri build)
        shell: bash
        run: node scripts/stage-windows-bundle-runtime.mjs
        env:
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}

      - name: Build app (unsigned bundle, skip frontend)
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ env.TARGET }} --config src-tauri/ci-unsigned.conf.json
        env:
          CI: false
          RUST_TARGET_TRIPLE: ${{ env.TARGET }}
          NITRO_PRESET: static

      - name: Package Windows portable ZIP
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-screen-portable-zh.ps1

      - name: Write Windows download guide
        shell: pwsh
        run: |
          @"
          Reko Windows builds (unsigned)
          =============================

          Recommended: Reko-Portable-win-x64-zh.zip
          - Extract the full ZIP, then run Reko.exe inside Reko-Portable/
          - Do not copy Reko.exe alone; FFmpeg DLLs must stay beside the exe

          Optional installers in this artifact:
          - NSIS *.exe — per-user setup wizard (Manufacturer: Reko)
          - MSI *.msi — enterprise-style installer (Manufacturer: Reko)

          Sidecar tools cap-cli.exe / cap-muxer.exe / cap-exporter.exe are internal helpers, not the product name.
          "@ | Set-Content -Encoding UTF8 dist/WINDOWS-DOWNLOAD.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reko-windows-x64-unsigned
          path: |
            target/${{ env.TARGET }}/release/bundle/nsis/*.exe
            target/${{ env.TARGET }}/release/bundle/msi/*.msi
            dist/Reko-Portable-win-x64-zh.zip
            dist/manifest-reko-portable-zh.json
            dist/WINDOWS-DOWNLOAD.txt
          if-no-files-found: error
